[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "DetectBodyInVideo"
version = "0.1.0"
description = "跨平台视频人体关键点识别工具，导出可直接驱动 RealityKit / USDZ 的 JSON"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "DetectBodyInVideo" }]
keywords = ["pose", "mediapipe", "realitykit", "arkit", "video"]

dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "python-multipart>=0.0.9",
  "opencv-python>=4.10",
  "numpy>=1.26",
  # 骨长约束拟合（postprocess/ik_fit.py）用 scipy.optimize.least_squares；
  # 纯 CPU、无编译扩展依赖，三平台都有 wheel
  "scipy>=1.11",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "mediapipe>=0.10.14",
  "onnxruntime>=1.18",
  "pywebview>=5.1",
]

[project.optional-dependencies]
# NVIDIA 机器：优先装 GPU 版（会自动替换 onnxruntime）
cuda = ["onnxruntime-gpu>=1.18", "pynvml>=11.5"]
# Apple Silicon：onnxruntime 自带 CoreML EP，无需额外包；保留 extra 便于脚本统一
mac = []
windows = ["pynvml>=11.5"]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "httpx>=0.27",
  "ruff>=0.5",
]

[project.scripts]
detect-body = "app.desktop.main:main"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py39"
exclude = ["app/frontend", "app/backend/static", "models"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]
